# The default sound device for every guest application. Apple's virtio sound device
# fails large periods with an I/O error (two of 12000 frames, speaker-test's default)
# and plays periods of 50-83 ms, so dmix fixes the period for all of them. dmix is
# also what lets several applications play at once.
pcm.!default {
    type plug
    slave.pcm "openvm"
}

pcm.openvm {
    type dmix
    ipc_key 5281
    ipc_perm 0666
    slave {
        pcm "hw:0,0"
        rate 48000
        channels 2
        format S16_LE
        period_time 50000
        buffer_time 200000
    }
}

ctl.!default {
    type hw
    card 0
}
