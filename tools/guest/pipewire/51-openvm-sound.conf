# WirePlumber 0.5 setting for a Linux guest in openVM. Copy it to
# ~/.config/wireplumber/wireplumber.conf.d/ in the guest, then run
#   systemctl --user restart wireplumber pipewire pipewire-pulse
#
# Apple's virtio-sound device plays silence when a guest writes 5 ms periods or less, and PipeWire's
# default drives it with 2.5 ms periods, so a PipeWire desktop is silent. This asks for 1024-frame
# periods with four buffered; PipeWire settled on 512-frame periods and a 2048-frame buffer, and the
# guest played (docs/evidence/linux-iso-sound-2026-11-11.md). It matches every ALSA output, which in
# an openVM guest is that one device.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.period-num = 4
        api.alsa.headroom = 1024
      }
    }
  }
]
