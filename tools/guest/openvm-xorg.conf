# The virtio-gpu display, no GL acceleration. openvm-desktop-server appends the
# input devices: without udev Xorg cannot find them itself.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
EndSection

Section "Device"
    Identifier "virtio-gpu"
    Driver "modesetting"
    Option "AccelMethod" "none"
EndSection

